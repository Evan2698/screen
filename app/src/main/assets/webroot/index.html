<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Casting</title>
    <link rel="icon" type="icon" sizes="192x192" href="img/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="img/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="stylesheet" href="css/main.css" />
</head>

<body>
    <div class="page-shell">
        <div class="toolbar" aria-label="Screen controls">
            <button id="join" class="button primary">Connect</button>
            <button id="fullscreen" class="button secondary">Full</button>
            <button id="toggle-fps" class="button ghost">FPS</button>
        </div>

        <div class="viewport-panel" aria-live="polite">
            <div class="screen-frame">
                <button class="action-button left" id="home" aria-label="Home key">
                    <img src="img/home.svg" alt="Home" />
                </button>

                <canvas id="screen" aria-label="Screen content"></canvas>

                <button class="action-button right" id="back" aria-label="Back key">
                    <img src="img/back.svg" alt="Back" />
                </button>
            </div>
        </div>
    </div>

    <script src="js/socket.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
